<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stockinator 5000</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <!-- Installable app (Chrome on PC/Android, iPhone home screen) -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0d1219">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Stockinator">
  <meta property="og:image" content="/logo-512.png">
  <meta property="og:title" content="Stockinator 5000">
  <meta property="og:description" content="Buffett-style stock valuation and research tool">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body class="locked">
  <div id="login-screen" class="login-screen" hidden></div>
  <nav class="nav">
    <div class="brand">
      <!-- Back / forward: shown only in the installed app, which has no browser toolbar -->
      <span class="app-history">
        <button class="app-hist-btn" id="app-back" type="button" aria-label="Back" title="Back">&#8592;</button>
        <button class="app-hist-btn" id="app-forward" type="button" aria-label="Forward" title="Forward">&#8594;</button>
      </span>
      <img src="/logo-lockup.svg" alt="Stockinator 5000" height="28">
    </div>
    <div class="nav-right">
      <div class="nav-tabs">
        <button class="nav-tab" id="tab-calculator">Calculator</button>
        <button class="nav-tab" id="tab-reverse">Reverse DCF</button>
        <button class="nav-tab" id="tab-filings">Filings</button>
        <button class="nav-tab" id="tab-valuations">Saved Valuations</button>
        <button class="nav-tab" id="tab-watchlist">Watchlist</button>
        <button class="nav-tab" id="tab-portfolio">Portfolio</button>
        <button class="nav-tab" id="tab-charts">Charts <span class="proto-badge">Prototype</span></button>
        <button class="nav-tab" id="tab-screener">Screener</button>
        <button class="nav-tab disabled" disabled title="Coming soon">Research</button>
      </div>
      <button class="nav-schwab" id="schwab-status" type="button">Schwab</button>
      <button class="nav-signout" id="signout" type="button">Sign Out</button>
      <button class="hamburger-btn" id="hamburger" type="button" aria-label="Menu" aria-expanded="false">☰</button>
    </div>
  </nav>
  <!-- Side drawer (phones and narrow windows): same pattern as Financinator -->
  <div class="drawer-scrim" id="drawer-scrim"></div>
  <div class="drawer" id="drawer" role="dialog" aria-label="Menu">
    <div class="drawer-header">
      <h2>Menu</h2>
      <button class="drawer-close" id="drawer-close" type="button" aria-label="Close menu">✕</button>
    </div>
    <div class="drawer-actions">
      <div class="drawer-nav">
        <button class="drawer-tab" type="button" data-route="/calculator">Calculator</button>
        <button class="drawer-tab" type="button" data-route="/reverse">Reverse DCF</button>
        <button class="drawer-tab" type="button" data-route="/filings">Filings</button>
        <button class="drawer-tab" type="button" data-route="/valuations">Saved Valuations</button>
        <button class="drawer-tab" type="button" data-route="/watchlist">Watchlist</button>
        <button class="drawer-tab" type="button" data-route="/portfolio">Portfolio</button>
        <button class="drawer-tab" type="button" data-route="/charts">Charts <span class="proto-badge">Prototype</span></button>
        <button class="drawer-tab" type="button" data-route="/screener">Screener</button>
        <button class="drawer-tab" type="button" data-route="/schwab">Schwab connection</button>
      </div>
    </div>
    <div class="drawer-footer">
      <div class="drawer-divider"></div>
      <button class="drawer-signout" id="drawer-signout" type="button">Sign Out</button>
    </div>
  </div>
  <main class="content" id="app"></main>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
